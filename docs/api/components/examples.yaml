# Covers: Every Problem Details example, one per error code.
# Read when: adding or checking an error response.
# Related: ../openapi.yaml, responses.yaml, ../../design/api/errors-and-concurrency.md
problem_malformed_request:
  summary: Malformed request
  value:
    type: urn:pace:problem:malformed_request
    title: Malformed request
    status: 400
    detail: The request body or a parameter could not be understood, or it contains an unknown field.
    instance: /api/v1/example
    code: malformed_request
    requestId: 019a4c10-1111-7000-8000-abcdefabcdef
