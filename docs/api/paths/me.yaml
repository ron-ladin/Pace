/me/photo:
  put:
    operationId: putMyPhoto
    tags:
      - Me
    summary: Set profile photo
    description: The image is always re-encoded to a 512x512 JPEG, which removes EXIF data such as GPS coordinates.
    x-access-patterns:
      - W6
    security:
      - sessionCookie: []
    requestBody:
      required: true
      description: Raw image bytes, at most 2 MB.
      content:
        image/jpeg:
          schema:
            type: string
            contentMediaType: image/jpeg
        image/png:
          schema:
            type: string
            contentMediaType: image/png
    responses:
      "200":
        description: Photo stored.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/PhotoResponse"
            example:
              photoUrl: /api/v1/users/0193f2a0-7c11-7d3e-9a10-5b2c8e4f1a01/photos/019a4c20-6bd1-7e93-a5c8-2f0b7d9e1c09
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "403":
        description: Not allowed, or rejected as cross-site.
        headers:
