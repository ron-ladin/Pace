        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              image_invalid:
                $ref: "../components/examples.yaml#/problem_image_invalid"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
  delete:
    operationId: deleteMyPhoto
    tags:
      - Me
    summary: Remove profile photo
    description: Remove profile photo
    x-access-patterns:
      - W6
    security:
      - sessionCookie: []
    responses:
      "204":
        description: Photo removed, or there was none.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
