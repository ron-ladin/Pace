      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
/me/deletion:
  post:
    operationId: deleteAccount
    tags:
      - Me
    summary: Delete account
    description: "Phase 1 of the two-phase deletion (D29), in one transaction: wipes personal data and revokes all sessions. This cannot be undone. Uses POST because the password needs a body."
    x-access-patterns:
      - W6
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/DeleteAccountRequest"
          example:
            password: correct horse battery
    responses:
      "204":
        description: Account deleted.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
          Set-Cookie:
            $ref: "../components/headers.yaml#/ClearSessionCookie"
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
