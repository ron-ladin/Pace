# Covers: Creating, listing, searching and deleting groups, and a group's competitions.
# Read when: working on group endpoints.
# Related: ../openapi.yaml, group-members.yaml, ../../design/api/auth.md
/groups:
  post:
    operationId: createGroup
    tags:
      - Groups
    summary: Create a group
    description: "The creator becomes its admin. Not idempotent: the client must disable the button while the request is in flight."
    x-access-patterns:
      - W5
    security:
      - sessionCookie: []
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: "../components/schemas.yaml#/CreateGroupRequest"
          example:
            name: Haifa Morning Runners
            visibility: public
            city: Haifa
    responses:
      "201":
        description: Group created.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
          Location:
            $ref: "../components/headers.yaml#/Location"
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Group"
            example:
              id: 0199b2d4-5510-7b6e-94c2-6e1f0a8d3c06
              name: Haifa Morning Runners
              visibility: public
              city: Haifa
              createdAt: 2026-08-01T09:00:00Z
              memberCount: 1
              viewer:
                isMember: true
                role: admin
                invited: false
                canJoin: false
                canInvite: false
                canManage: true
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "403":
        description: Not allowed, or rejected as cross-site.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              csrf_rejected:
                $ref: "../components/examples.yaml#/problem_csrf_rejected"
      "413":
        description: Body too large.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              payload_too_large:
                $ref: "../components/examples.yaml#/problem_payload_too_large"
      "415":
        description: Unsupported Content-Type.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              unsupported_media_type:
                $ref: "../components/examples.yaml#/problem_unsupported_media_type"
      "422":
        description: Understood, but breaks a rule.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              validation_failed:
                $ref: "../components/examples.yaml#/problem_validation_failed"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
  get:
    operationId: searchGroups
    tags:
      - Groups
    summary: Search public groups
    description: Public groups only. Case-insensitive substring match on `q` and `city`, newest first. At least one of `q` or `city` is required.
    x-access-patterns:
      - R8
    security:
      - sessionCookie: []
    parameters:
      - name: q
        in: query
        required: false
        description: Text to find in the name.
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - name: city
        in: query
        required: false
        description: Text to find in the city.
        schema:
          type: string
          minLength: 2
          maxLength: 100
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
    responses:
      "200":
        description: Matching groups.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - nextCursor
              properties:
                items:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/GroupSummary"
                nextCursor:
                  $ref: "../components/schemas.yaml#/NextCursor"
            example:
              items:
                - id: 0199b2d4-5510-7b6e-94c2-6e1f0a8d3c06
                  name: Haifa Morning Runners
                  visibility: public
                  city: Haifa
              nextCursor: null
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              invalid_cursor:
                $ref: "../components/examples.yaml#/problem_invalid_cursor"
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "422":
        description: Understood, but breaks a rule.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              validation_failed:
                $ref: "../components/examples.yaml#/problem_validation_failed"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
