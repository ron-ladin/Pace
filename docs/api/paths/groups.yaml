      "503":
        $ref: "../components/responses.yaml#/Unavailable"
/groups/{groupId}:
  get:
    operationId: getGroup
    tags:
      - Groups
    summary: Get a group
    description: Private groups are visible to members and invitees only. Everyone else gets 404.
    x-access-patterns:
      - R7
    security:
      - sessionCookie: []
    parameters:
      - name: groupId
        in: path
        required: true
        description: A group ID.
        schema:
          type: string
          format: uuid
    responses:
      "200":
        description: The group.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Group"
            example:
              id: 0199b2d4-5510-7b6e-94c2-6e1f0a8d3c06
              name: Haifa Morning Runners
              visibility: public
              city: Haifa
              createdAt: 2026-08-01T09:00:00Z
              memberCount: 42
              viewer:
                isMember: true
                role: admin
                invited: false
                canJoin: false
                canInvite: false
                canManage: true
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "404":
        description: Does not exist, or the viewer may not know it exists.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              not_found:
                $ref: "../components/examples.yaml#/problem_not_found"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
  delete:
    operationId: deleteGroup
    tags:
      - Groups
    summary: Delete a group
    description: Admin only. Its competitions continue without a group.
    x-access-patterns:
      - W5
    security:
      - sessionCookie: []
    parameters:
      - name: groupId
        in: path
        required: true
        description: A group ID.
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: Group deleted.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "403":
        description: Not allowed, or rejected as cross-site.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              forbidden:
                $ref: "../components/examples.yaml#/problem_forbidden"
              csrf_rejected:
                $ref: "../components/examples.yaml#/problem_csrf_rejected"
      "404":
        description: Does not exist, or the viewer may not know it exists.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              not_found:
                $ref: "../components/examples.yaml#/problem_not_found"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
/groups/{groupId}/competitions:
  get:
    operationId: listGroupCompetitions
    tags:
      - Groups
    summary: List a group's competitions
    description: Members see all of them. Non-members of a public group, and invitees of a private group, see its public competitions only. Anyone else gets 404 for a private group.
    x-access-patterns:
      - R5
      - R6
    security:
      - sessionCookie: []
    parameters:
      - name: groupId
        in: path
        required: true
        description: A group ID.
        schema:
          type: string
          format: uuid
      - $ref: "../components/parameters.yaml#/Limit"
      - $ref: "../components/parameters.yaml#/Cursor"
    responses:
      "200":
        description: Competitions, newest first.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
        content:
          application/json:
            schema:
              type: object
              required:
                - items
                - nextCursor
              properties:
                items:
                  type: array
                  items:
                    $ref: "../components/schemas.yaml#/CompetitionSummary"
                nextCursor:
                  $ref: "../components/schemas.yaml#/NextCursor"
            example:
              items:
                - id: 019a2e65-1f30-7a88-b7d0-c42e91f7ab07
                  name: November Distance Challenge
                  city: Haifa
                  rule:
                    type: total_distance
                  visibility: public
                  startsAt: 2026-11-01T00:00:00Z
                  endsAt: 2026-12-01T00:00:00Z
                  closesAt: 2026-12-01T06:00:00Z
                  state: running
              nextCursor: null
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              invalid_cursor:
                $ref: "../components/examples.yaml#/problem_invalid_cursor"
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "404":
        description: Does not exist, or the viewer may not know it exists.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              not_found:
                $ref: "../components/examples.yaml#/problem_not_found"
      "422":
        description: Understood, but breaks a rule.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              validation_failed:
                $ref: "../components/examples.yaml#/problem_validation_failed"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
