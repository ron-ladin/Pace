/groups/{groupId}/invitations/{userId}:
  put:
    operationId: inviteToGroup
    tags:
      - Groups
    summary: Invite a user to a private group
    description: Admin only, and private groups only. Already invited or already a member is a harmless 204.
    x-access-patterns:
      - W5
    security:
      - sessionCookie: []
    parameters:
      - name: groupId
        in: path
        required: true
        description: A group ID.
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        description: A user ID.
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: The user is invited, or is already in.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
