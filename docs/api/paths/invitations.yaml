# Covers: The current user's pending invitations, and declining them.
# Read when: working on invitation endpoints.
# Related: ../openapi.yaml, group-members.yaml, competition-participants.yaml
/me/invitations:
  get:
    operationId: listMyInvitations
    tags:
      - Invitations
    summary: List my pending invitations
    description: The newest 100, across groups and competitions. To accept one, join with `PUT /groups/{groupId}/members/me` or `PUT /competitions/{competitionId}/participants/me`.
    x-access-patterns:
      - W3
      - W5
    security:
      - sessionCookie: []
    responses:
      "200":
        description: Pending invitations.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
        content:
          application/json:
            schema:
              type: object
              required:
                - items
              properties:
                items:
                  type: array
                  maxItems: 100
                  items:
                    $ref: "../components/schemas.yaml#/Invitation"
            example:
              items:
                - type: competition
                  target:
                    id: 019a0d11-8c22-7f55-9b3e-1d7a6c5e4f08
                    name: Office 10K
                  invitedBy:
                    id: 0193f2a0-9e42-7a1b-8c33-1f6d2b7c9e02
                    displayName: Noa Peretz
                    photoUrl: null
                  createdAt: 2026-11-01T12:00:00Z
                - type: group
                  target:
                    id: 0199b2d4-5510-7b6e-94c2-6e1f0a8d3c06
                    name: Haifa Morning Runners
                  invitedBy:
                    id: 0193f2a0-7c11-7d3e-9a10-5b2c8e4f1a01
                    displayName: Dana Levi
                    photoUrl: /api/v1/users/0193f2a0-7c11-7d3e-9a10-5b2c8e4f1a01/photos/019a4c20-6bd1-7e93-a5c8-2f0b7d9e1c09
                  createdAt: 2026-10-20T12:00:00Z
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
/me/invitations/groups/{groupId}:
  delete:
    operationId: declineGroupInvitation
    tags:
      - Invitations
    summary: Decline a group invitation
    description: Succeeds even if there is no invitation.
    x-access-patterns:
      - W5
    security:
      - sessionCookie: []
    parameters:
      - name: groupId
        in: path
        required: true
        description: A group ID.
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: No invitation remains.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "403":
        description: Not allowed, or rejected as cross-site.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              csrf_rejected:
                $ref: "../components/examples.yaml#/problem_csrf_rejected"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
/me/invitations/competitions/{competitionId}:
  delete:
    operationId: declineCompetitionInvitation
    tags:
      - Invitations
    summary: Decline a competition invitation
