# Covers: The competition leaderboard.
# Read when: working on leaderboard responses.
# Related: ../openapi.yaml, ../../design/api/competition-semantics.md
/competitions/{competitionId}/leaderboard:
  get:
    operationId: getLeaderboard
    tags:
      - Leaderboards
    summary: Get the leaderboard and my rank
    description: |-
      One request for the whole screen: top entries plus my rank.

      - **Participants** (`viewerAccess: full`) can page through everyone, and see `userId`, `photoUrl` and `isMe`.
      - **Everyone else who can see the competition** (`viewerAccess: top_n`) gets the top N only (default 10, configurable), with rank, display name and score. `limit` is capped at N, and a `cursor` returns 403.
      - `me` is `null` if the viewer is not participating. `me.rank` is `null` if they are participating with no eligible run. `me` is absent on pages after the first.
      - Ties share a rank (1, 1, 3). Deleted users never appear, and ranks close up.

      Poll every `pollIntervalSeconds` while the tab is visible, sending the last `ETag` as `If-None-Match`. Stop when it is `null`, which happens once the competition is closed.

      Fresh as of `asOf`. After a 304, the data is fresh as of the response `Date` header.
    x-access-patterns:
      - R2
    security:
      - {}
      - sessionCookie: []
    parameters:
      - name: competitionId
        in: path
        required: true
        description: A competition ID.
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        description: Page size. For `top_n` viewers, capped at N.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 10
      - $ref: "../components/parameters.yaml#/Cursor"
      - name: If-None-Match
        in: header
        required: false
        description: The `ETag` from the previous response.
        schema:
          type: string
    responses:
      "200":
        description: The leaderboard.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlRevalidate"
          ETag:
            $ref: "../components/headers.yaml#/ETag"
          Vary:
            $ref: "../components/headers.yaml#/VaryCookie"
        content:
          application/json:
            schema:
              $ref: "../components/schemas.yaml#/Leaderboard"
            example:
              state: running
              scoreUnit: meters
              viewerAccess: full
              asOf: 2026-11-03T10:00:00Z
              pollIntervalSeconds: 25
              entries:
                - rank: 1
                  displayName: Noa Peretz
                  score: 42000
                  userId: 0193f2a0-9e42-7a1b-8c33-1f6d2b7c9e02
                  photoUrl: null
                  isMe: false
                - rank: 1
                  displayName: Amir Cohen
                  score: 42000
                  userId: 0193f2a1-03d7-7f20-b1aa-77c3e0d4a603
                  photoUrl: null
                  isMe: false
                - rank: 3
                  displayName: Dana Levi
                  score: 31000
                  userId: 0193f2a0-7c11-7d3e-9a10-5b2c8e4f1a01
                  photoUrl: /api/v1/users/0193f2a0-7c11-7d3e-9a10-5b2c8e4f1a01/photos/019a4c20-6bd1-7e93-a5c8-2f0b7d9e1c09
                  isMe: true
              me:
                rank: 3
                score: 31000
              nextCursor: null
      "304":
        description: Unchanged since the given ETag.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlRevalidate"
          ETag:
            $ref: "../components/headers.yaml#/ETag"
          Vary:
            $ref: "../components/headers.yaml#/VaryCookie"
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              invalid_cursor:
                $ref: "../components/examples.yaml#/problem_invalid_cursor"
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "403":
        description: Not allowed, or rejected as cross-site.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              full_leaderboard_forbidden:
                $ref: "../components/examples.yaml#/problem_full_leaderboard_forbidden"
      "404":
        description: Does not exist, or the viewer may not know it exists.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              not_found:
                $ref: "../components/examples.yaml#/problem_not_found"
      "422":
        description: Understood, but breaks a rule.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              validation_failed:
                $ref: "../components/examples.yaml#/problem_validation_failed"
      "429":
        $ref: "../components/responses.yaml#/RateLimited"
      "500":
        $ref: "../components/responses.yaml#/InternalError"
      "503":
        $ref: "../components/responses.yaml#/Unavailable"
