      "503":
        $ref: "../components/responses.yaml#/Unavailable"
/competitions/{competitionId}/invitations/{userId}:
  put:
    operationId: inviteToCompetition
    tags:
      - Competitions
    summary: Invite a user to a private competition
    description: The creator or an admin of the owning group, and private competitions only. Already invited or already in is a harmless 204.
    x-access-patterns:
      - W3
    security:
      - sessionCookie: []
    parameters:
      - name: competitionId
        in: path
        required: true
        description: A competition ID.
        schema:
          type: string
          format: uuid
      - name: userId
        in: path
        required: true
        description: A user ID.
        schema:
          type: string
          format: uuid
    responses:
      "204":
        description: The user is invited, or is already in.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
          Cache-Control:
            $ref: "../components/headers.yaml#/CacheControlNoStore"
      "400":
        description: The request could not be understood.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
              $ref: "../components/schemas.yaml#/Problem"
            examples:
              malformed_request:
                $ref: "../components/examples.yaml#/problem_malformed_request"
      "401":
        $ref: "../components/responses.yaml#/Unauthenticated"
      "403":
        description: Not allowed, or rejected as cross-site.
        headers:
          X-Request-Id:
            $ref: "../components/headers.yaml#/XRequestId"
        content:
          application/problem+json:
            schema:
