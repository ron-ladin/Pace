components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pace_session
      description: An opaque session token in an HttpOnly, Secure, SameSite=Strict cookie, set by login and registration. Not readable by JavaScript.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: The `nextCursor` from the previous page. Keep the other query parameters unchanged.
      schema:
        type: string
        maxLength: 512
  headers:
    XRequestId:
      description: The request ID, also in logs and error bodies.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
        minimum: 0
    Location:
      description: The URL of the new resource.
      schema:
        type: string
    ETag:
      description: Identifies this content. Excludes `asOf`.
      schema:
        type: string
    VaryCookie:
      description: The content depends on the viewer.
      schema:
        type: string
        const: Cookie
    CacheControlNoStore:
      description: Must not be stored.
      schema:
        type: string
        const: no-store
    CacheControlRevalidate:
      description: May be stored, but must be revalidated before use.
      schema:
        type: string
        const: private, no-cache
    CacheControlImmutable:
      description: This URL never changes content.
      schema:
        type: string
        const: private, max-age=31536000, immutable
    SetSessionCookie:
      description: "Sets the session cookie: `__Host-pace_session=<token>; HttpOnly; Secure; SameSite=Strict; Path=/; Max-Age=<seconds>`."
      schema:
        type: string
    ClearSessionCookie:
      description: Clears the session cookie.
      schema:
        type: string
  responses:
    Unauthenticated:
      description: Not logged in, or the session expired or was revoked.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            unauthenticated:
              $ref: "#/components/examples/problem_unauthenticated"
    RateLimited:
      description: Rate limit exceeded.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            rate_limited:
              $ref: "#/components/examples/problem_rate_limited"
    InternalError:
      description: An unexpected error.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            internal_error:
              $ref: "#/components/examples/problem_internal_error"
    Unavailable:
      description: Temporarily unavailable. Safe to retry.
      headers:
        X-Request-Id:
          $ref: "#/components/headers/XRequestId"
        Retry-After:
          $ref: "#/components/headers/RetryAfter"
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
          examples:
            temporarily_unavailable:
              $ref: "#/components/examples/problem_temporarily_unavailable"
  examples:
    problem_malformed_request:
      summary: Malformed request
      value:
        type: urn:pace:problem:malformed_request
        title: Malformed request
        status: 400
        detail: The request body or a parameter could not be understood, or it contains an unknown field.
        instance: /api/v1/example
        code: malformed_request
        requestId: 019a4c10-1111-7000-8000-abcdefabcdef
    problem_invalid_cursor:
      summary: Invalid cursor
