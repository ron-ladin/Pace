  /me/password:
    put:
      operationId: changePassword
      tags:
        - Me
      summary: Change password
      description: Requires the current password. Revokes all other sessions and issues a new token for this one.
      x-access-patterns:
        - W6
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
            example:
              currentPassword: correct horse battery
              newPassword: a much longer passphrase
      responses:
        "204":
          description: Password changed.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
