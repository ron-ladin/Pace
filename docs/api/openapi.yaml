# Pace API contract, Phase 1. This file is the source of truth for the HTTP API.
# Design rationale: docs/design/api.md. Lint and checks: docs/api/verification/README.md.
openapi: 3.1.0
info:
  title: Pace API
  version: 1.0.0
  contact:
    name: Pace project
  description: |-
    The contract between the Pace PWA and its backend, for Phase 1. Design rationale: `docs/design/api.md`. **This file is the source of truth for the API.**

    **Conventions**
    - camelCase JSON. Field names carry units (`distanceMeters`, `durationSeconds`, `paceSecondsPerKm`). IDs are UUIDv7. Times are RFC 3339 in UTC.
    - **Null** means the viewer may know this, and there is no value. **Absent** means the viewer is not entitled to the field, or it does not apply.
    - Clients must ignore unknown response fields, and must handle unknown values of open enums (`x-extensible-enum`). The server rejects unknown request fields with 400.
    - Lists return `{items, nextCursor}`. `nextCursor: null` means the last page. Cursors are opaque.
    - Errors are `application/problem+json`. Switch on `code`.
    - **404 means "you cannot see this"**, and it is also returned for private resources that exist. 403 means "you can see this, but cannot do that".
    - Every request may send `X-Request-Id` (`^[A-Za-z0-9._-]{8,64}$`). Otherwise one is generated. Every response returns it.
    - The same-origin session cookie is sent automatically. Send requests with `credentials: same-origin`. **Do not cache `/api/` in the service worker.**
    - Sessions slide: any authenticated response may carry a `Set-Cookie` that renews the session cookie (at most hourly). Browsers apply it automatically, so clients need no code for this.
servers:
  - url: /api/v1
    description: Same origin as the PWA.
tags:
  - name: Auth
    description: Registration and sessions.
  - name: Me
    description: The current user's account.
  - name: Users
    description: Finding and viewing other users.
  - name: Runs
    description: GPX upload, history and stats.
  - name: Friends
    description: Friendships and friend requests.
  - name: Groups
    description: Long-lived communities.
  - name: Competitions
    description: Time-boxed events.
  - name: Leaderboards
    description: Rankings.
  - name: Invitations
    description: Pending invitations to groups and competitions.
x-no-endpoint:
  W4: Competition closure is a scheduled job. Clients observe it through `state` on GET /competitions/{competitionId} and the leaderboard.
security:
  - sessionCookie: []
paths:
  /auth/register:
    post:
      operationId: register
      tags:
        - Auth
      summary: Register and log in
      description: Creates an account and a session. Reveals that an email is registered (409 `email_taken`), because this cannot be avoided without email verification. Strict per-IP rate limits apply.
      x-access-patterns:
        - W6
      security:
        - {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
            example:
              email: dana@example.com
              password: correct horse battery
              displayName: Dana Levi
              timeZone: Asia/Jerusalem
      responses:
        "201":
          description: Account created, and logged in.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Set-Cookie:
              $ref: "#/components/headers/SetSessionCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CurrentUser"
              example:
                id: 0193f2a0-7c11-7d3e-9a10-5b2c8e4f1a01
                email: dana@example.com
                displayName: Dana Levi
                birthDate: null
                city: null
                photoUrl: null
                runPrivacy: private
                timeZone: Asia/Jerusalem
                createdAt: 2026-01-15T18:20:00Z
        "400":
          description: The request could not be understood.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                malformed_request:
                  $ref: "#/components/examples/problem_malformed_request"
        "403":
          description: Not allowed, or rejected as cross-site.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                csrf_rejected:
                  $ref: "#/components/examples/problem_csrf_rejected"
        "409":
          description: Conflicts with the current state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                email_taken:
                  $ref: "#/components/examples/problem_email_taken"
        "413":
          description: Body too large.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                payload_too_large:
                  $ref: "#/components/examples/problem_payload_too_large"
        "415":
          description: Unsupported Content-Type.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unsupported_media_type:
                  $ref: "#/components/examples/problem_unsupported_media_type"
        "422":
          description: Understood, but breaks a rule.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                weak_password:
                  $ref: "#/components/examples/problem_weak_password"
                validation_failed:
                  $ref: "#/components/examples/problem_validation_failed"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          $ref: "#/components/responses/Unavailable"
