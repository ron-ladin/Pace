  /me/photo:
    put:
      operationId: putMyPhoto
      tags:
        - Me
      summary: Set profile photo
      description: The image is always re-encoded to a 512x512 JPEG, which removes EXIF data such as GPS coordinates.
      x-access-patterns:
        - W6
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: Raw image bytes, at most 2 MB.
        content:
          image/jpeg:
            schema:
              type: string
              contentMediaType: image/jpeg
          image/png:
            schema:
              type: string
              contentMediaType: image/png
      responses:
        "200":
          description: Photo stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
