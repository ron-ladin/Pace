  /runs:
    post:
      operationId: uploadRun
      tags:
        - Runs
      summary: Upload a run (GPX)
      description: |-
        Parses and scores the run synchronously (D26, D30). Safe to retry: the file hash makes this idempotent.

        - **201**: a new run. Check `status`: a well-formed but implausible run is stored with `status: invalid` and never scored.
        - **200**: this exact file was already uploaded. The body is the original run, with the same status.

        The client must set `Content-Type: application/gpx+xml` explicitly, because browsers often leave `File.type` empty for `.gpx`. Gzip request bodies are refused.
      x-access-patterns:
        - W1
        - W2
      security:
        - sessionCookie: []
      requestBody:
        required: true
        description: The raw GPX file, at most 20 MB.
        content:
          application/gpx+xml:
            schema:
              type: string
              contentMediaType: application/gpx+xml
            example: |
              <?xml version="1.0" encoding="UTF-8"?>
              <gpx version="1.1" creator="example" xmlns="http://www.topografix.com/GPX/1/1">
                <trk><trkseg>
                  <trkpt lat="32.7940" lon="34.9896"><time>2026-11-02T05:30:00Z</time></trkpt>
                  <trkpt lat="32.7945" lon="34.9901"><time>2026-11-02T05:30:20Z</time></trkpt>
                </trkseg></trk>
              </gpx>
      responses:
        "200":
          description: This file was already uploaded. Returns the original run.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnRun"
              example:
                id: 019a3f77-81cd-7e10-a2f4-90b1d3c6e805
                source: gpx_upload
                startedAt: 2026-11-02T05:30:00Z
                endedAt: 2026-11-02T06:22:30Z
                distanceMeters: 42000
                durationSeconds: 3150
                paceSecondsPerKm: 75
                status: invalid
                invalidReason: pace_too_fast
                receivedAt: 2026-11-02T06:40:12Z
        "201":
          description: New run stored.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlNoStore"
            Location:
              $ref: "#/components/headers/Location"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnRun"
              example:
                id: 019a4c10-22ab-7c44-8e01-3ad9f6b2c704
                source: gpx_upload
                startedAt: 2026-11-02T05:30:00Z
                endedAt: 2026-11-02T06:22:30Z
                distanceMeters: 10240
                durationSeconds: 3150
                paceSecondsPerKm: 308
                status: valid
                invalidReason: null
                receivedAt: 2026-11-02T06:40:12Z
        "401":
          $ref: "#/components/responses/Unauthenticated"
        "403":
          description: Not allowed, or rejected as cross-site.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                csrf_rejected:
                  $ref: "#/components/examples/problem_csrf_rejected"
        "409":
          description: Conflicts with the current state.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                run_overlap:
                  $ref: "#/components/examples/problem_run_overlap"
        "413":
          description: Body too large.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                payload_too_large:
                  $ref: "#/components/examples/problem_payload_too_large"
        "415":
          description: Unsupported Content-Type.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                unsupported_media_type:
                  $ref: "#/components/examples/problem_unsupported_media_type"
        "422":
          description: Understood, but breaks a rule.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
              examples:
                gpx_malformed:
                  $ref: "#/components/examples/problem_gpx_malformed"
                gpx_out_of_range:
                  $ref: "#/components/examples/problem_gpx_out_of_range"
                run_in_future:
                  $ref: "#/components/examples/problem_run_in_future"
                run_too_old:
                  $ref: "#/components/examples/problem_run_too_old"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"
        "503":
          description: Temporarily unavailable. Safe to retry.
          headers:
            X-Request-Id:
