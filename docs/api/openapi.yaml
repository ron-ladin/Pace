# Pace API contract, Phase 1. This file is the source of truth for the HTTP API.
# Design rationale: docs/design/api.md. Lint and checks: docs/api/verification/README.md.
# Split into paths/ and components/. Bundle it into one file with the command in docs/api/verification/README.md.
openapi: 3.1.0
info:
  title: Pace API
  version: 1.0.0
  contact:
    name: Pace project
  description: |-
    The contract between the Pace PWA and its backend, for Phase 1. Design rationale: `docs/design/api.md`. **This file is the source of truth for the API.**

    **Conventions**
    - camelCase JSON. Field names carry units (`distanceMeters`, `durationSeconds`, `paceSecondsPerKm`). IDs are UUIDv7. Times are RFC 3339 in UTC.
    - **Null** means the viewer may know this, and there is no value. **Absent** means the viewer is not entitled to the field, or it does not apply.
    - Clients must ignore unknown response fields, and must handle unknown values of open enums (`x-extensible-enum`). The server rejects unknown request fields with 400.
    - Lists return `{items, nextCursor}`. `nextCursor: null` means the last page. Cursors are opaque.
    - Errors are `application/problem+json`. Switch on `code`.
    - **404 means "you cannot see this"**, and it is also returned for private resources that exist. 403 means "you can see this, but cannot do that".
    - Every request may send `X-Request-Id` (`^[A-Za-z0-9._-]{8,64}$`). Otherwise one is generated. Every response returns it.
    - The same-origin session cookie is sent automatically. Send requests with `credentials: same-origin`. **Do not cache `/api/` in the service worker.**
    - Sessions slide: any authenticated response may carry a `Set-Cookie` that renews the session cookie (at most hourly). Browsers apply it automatically, so clients need no code for this.
servers:
  - url: /api/v1
    description: Same origin as the PWA.
tags:
  - name: Auth
    description: Registration and sessions.
  - name: Me
    description: The current user's account.
  - name: Users
    description: Finding and viewing other users.
  - name: Runs
    description: GPX upload, history and stats.
  - name: Friends
    description: Friendships and friend requests.
  - name: Groups
    description: Long-lived communities.
  - name: Competitions
    description: Time-boxed events.
  - name: Leaderboards
    description: Rankings.
  - name: Invitations
    description: Pending invitations to groups and competitions.
x-no-endpoint:
  W4: Competition closure is a scheduled job. Clients observe it through `state` on GET /competitions/{competitionId} and the leaderboard.
security:
  - sessionCookie: []
paths:
  /auth/register:
    $ref: paths/auth.yaml#/~1auth~1register
  /auth/login:
    $ref: paths/auth.yaml#/~1auth~1login
  /auth/logout:
    $ref: paths/auth.yaml#/~1auth~1logout
  /me:
    $ref: paths/me.yaml#/~1me
  /me/password:
    $ref: paths/me.yaml#/~1me~1password
  /me/deletion:
    $ref: paths/me.yaml#/~1me~1deletion
  /me/photo:
    $ref: paths/me.yaml#/~1me~1photo
  /me/stats:
    $ref: paths/runs.yaml#/~1me~1stats
  /users:
    $ref: paths/users.yaml#/~1users
  /users/{userId}:
    $ref: paths/users.yaml#/~1users~1{userId}
  /users/{userId}/photos/{photoId}:
    $ref: paths/users.yaml#/~1users~1{userId}~1photos~1{photoId}
  /users/{userId}/runs:
    $ref: paths/users.yaml#/~1users~1{userId}~1runs
  /runs:
    $ref: paths/runs.yaml#/~1runs
  /me/runs:
    $ref: paths/runs.yaml#/~1me~1runs
  /runs/{runId}:
    $ref: paths/runs.yaml#/~1runs~1{runId}
  /me/friends:
    $ref: paths/friends.yaml#/~1me~1friends
  /me/friends/{userId}:
    $ref: paths/friends.yaml#/~1me~1friends~1{userId}
  /groups:
    $ref: paths/groups.yaml#/~1groups
  /me/groups:
    $ref: paths/groups.yaml#/~1me~1groups
  /groups/{groupId}:
    $ref: paths/groups.yaml#/~1groups~1{groupId}
  /groups/{groupId}/members:
    $ref: paths/group-members.yaml#/~1groups~1{groupId}~1members
  /groups/{groupId}/members/me:
    $ref: paths/group-members.yaml#/~1groups~1{groupId}~1members~1me
  /groups/{groupId}/members/{userId}:
    $ref: paths/group-members.yaml#/~1groups~1{groupId}~1members~1{userId}
  /groups/{groupId}/invitations/{userId}:
    $ref: paths/group-members.yaml#/~1groups~1{groupId}~1invitations~1{userId}
  /groups/{groupId}/competitions:
    $ref: paths/groups.yaml#/~1groups~1{groupId}~1competitions
  /competitions:
    $ref: paths/competitions.yaml#/~1competitions
  /me/competitions:
    $ref: paths/competitions.yaml#/~1me~1competitions
  /competitions/{competitionId}:
    $ref: paths/competitions.yaml#/~1competitions~1{competitionId}
  /competitions/{competitionId}/participants:
    $ref: paths/competition-participants.yaml#/~1competitions~1{competitionId}~1participants
  /competitions/{competitionId}/participants/me:
    $ref: paths/competition-participants.yaml#/~1competitions~1{competitionId}~1participants~1me
  /competitions/{competitionId}/invitations/{userId}:
    $ref: paths/competition-participants.yaml#/~1competitions~1{competitionId}~1invitations~1{userId}
  /competitions/{competitionId}/leaderboard:
    $ref: paths/leaderboards.yaml#/~1competitions~1{competitionId}~1leaderboard
  /me/invitations:
    $ref: paths/invitations.yaml#/~1me~1invitations
  /me/invitations/groups/{groupId}:
    $ref: paths/invitations.yaml#/~1me~1invitations~1groups~1{groupId}
  /me/invitations/competitions/{competitionId}:
    $ref: paths/invitations.yaml#/~1me~1invitations~1competitions~1{competitionId}
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-pace_session
      description: An opaque session token in an HttpOnly, Secure, SameSite=Strict cookie, set by login and registration. Not readable by JavaScript.
