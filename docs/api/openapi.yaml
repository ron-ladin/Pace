  /competitions/{competitionId}/leaderboard:
    get:
      operationId: getLeaderboard
      tags:
        - Leaderboards
      summary: Get the leaderboard and my rank
      description: |-
        One request for the whole screen: top entries plus my rank.

        - **Participants** (`viewerAccess: full`) can page through everyone, and see `userId`, `photoUrl` and `isMe`.
        - **Everyone else who can see the competition** (`viewerAccess: top_n`) gets the top N only (default 10, configurable), with rank, display name and score. `limit` is capped at N, and a `cursor` returns 403.
        - `me` is `null` if the viewer is not participating. `me.rank` is `null` if they are participating with no eligible run. `me` is absent on pages after the first.
        - Ties share a rank (1, 1, 3). Deleted users never appear, and ranks close up.

        Poll every `pollIntervalSeconds` while the tab is visible, sending the last `ETag` as `If-None-Match`. Stop when it is `null`, which happens once the competition is closed.

        Fresh as of `asOf`. After a 304, the data is fresh as of the response `Date` header.
      x-access-patterns:
        - R2
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: competitionId
          in: path
          required: true
          description: A competition ID.
          schema:
            type: string
            format: uuid
        - name: limit
          in: query
          required: false
          description: Page size. For `top_n` viewers, capped at N.
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 10
        - $ref: "#/components/parameters/Cursor"
        - name: If-None-Match
          in: header
          required: false
          description: The `ETag` from the previous response.
          schema:
            type: string
      responses:
        "200":
          description: The leaderboard.
          headers:
            X-Request-Id:
              $ref: "#/components/headers/XRequestId"
            Cache-Control:
              $ref: "#/components/headers/CacheControlRevalidate"
            ETag:
              $ref: "#/components/headers/ETag"
            Vary:
              $ref: "#/components/headers/VaryCookie"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Leaderboard"
              example:
                state: running
                scoreUnit: meters
                viewerAccess: full
                asOf: 2026-11-03T10:00:00Z
                pollIntervalSeconds: 25
                entries:
                  - rank: 1
                    displayName: Noa Peretz
                    score: 42000
                    userId: 0193f2a0-9e42-7a1b-8c33-1f6d2b7c9e02
                    photoUrl: null
                    isMe: false
                  - rank: 1
                    displayName: Amir Cohen
                    score: 42000
